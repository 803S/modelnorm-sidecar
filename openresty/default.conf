# 本文件被 /usr/local/openresty/nginx/conf/nginx.conf 以
# `include /etc/nginx/conf.d/*.conf;` 引入（位于 http 块内），
# 因此这里可以写 http 级指令（lua_shared_dict / proxy_* 等）。

lua_shared_dict model_cache 10m;
lua_shared_dict model_health 2m;  # 健康表：每模型~40bytes*200=8KB; TTL 45m

proxy_read_timeout 300s;
proxy_send_timeout 300s;
client_max_body_size 0;

upstream newapi_backend {
    server new-api:3000;
}

# ==== MODELNORM 区：BEGIN/END 之间为纯 Lua（LuaJIT 单测整段 loadstring，禁止引用 ngx）====
init_by_lua_block {
    -- init 阶段 cjson 全局未自动注入，健康表函数用到，显式 require（非 MODELNORM 区，单测不涉及）
    pcall(function() cjson = require "cjson" end)
-- >>>MODELNORM_BEGIN
    -- 写法归一化（只认名字形态，不依赖任何供应商配置）。
    -- 折叠规则：
    --   1) 大小写、空格、下划线、点 → 统一（glm-5.2 == glm-5-2 == glm_5_2）
    --   2) 渠道前缀 xxx/（z-ai/ cline/ deepseek/ mimo/ ...）
    --   3) :free / -free 后缀
    --   4) 日期戳 -20241022 / -260319 / -0731（8/6/4位）
    --   5) 思考档位：-thinking / :thinking / -thinking-high|low|medium / :thinking:low（冒号与短横都认）
    --   6) 条件归并（2026-09-21 新增）：-1 / -200k / -lite / -preview 结尾，且剥掉后基名在本次列表里真实存在 → 并入基名组
    -- 注意：canon 系函数内禁止使用 while/循环与「组量词 (…)?」—— Lua pattern 不支持组量词，
    --       写 (x)? 会被当字面 '?' 导致 gsub 永不匹配 + while 死循环（2026-09-21 事故，见笔记踩坑#8）
    local MN_MERGE_SUFFIX = { "-1", "-200k", "-lite", "-preview" }

    function mn_canon_key(id)
        local c = id:lower()
        c = c:gsub("[%s_%.]+", "-")
        c = c:gsub("%-+", "-")
        c = c:gsub("^[^/]+/", "")
        c = c:gsub("[%-:]free$", "")
        c = c:gsub("%-%d%d%d%d%d%d%d%d$", "")
        c = c:gsub("%-%d%d%d%d%d%d$", "")
        c = c:gsub("%-%d%d%d%d$", "")
        c = c:gsub("[%-:]thinking$", "")
        c = c:gsub("[%-:]thinking[%-:]%w+$", "")
        c = c:gsub("%-(high|low|medium)$", "")
        return c
    end

    -- 条件归并：仅当「剥后缀后的基名」在本次列表（idset=全小写集合）里真实存在时才归并；
    -- 否则维持原 key（例：claude-opus-4-1-20250805、mistral-ocr-4-1 均不归并）
    function mn_merged_key(id, idset)
        local k = mn_canon_key(id)
        local lo = id:lower()
        for i = 1, #MN_MERGE_SUFFIX do
            local s = MN_MERGE_SUFFIX[i]
            if #lo > #s and lo:sub(-#s) == s then
                local base = lo:sub(1, #lo - #s)
                if idset[base] then
                    return mn_canon_key(base), base
                end
            end
        end
        return k, nil
    end

    -- 同组挑"最规范的展示名"：无前缀(8) > 无free(4) > 无日期(2) > 全小写(1) > 更短
    function mn_name_rank(s)
        local sl = s:lower()
        local r = 0
        if s:find("/", 1, true) then r = r + 8 end
        if sl:match("[%-:]free$") then r = r + 4 end
        if sl:match("%-%d%d%d%d%d%d%d%d$") or sl:match("%-%d%d%d%d%d%d$") or sl:match("%-%d%d%d%d$") then r = r + 2 end
        if s ~= sl then r = r + 1 end
        return r
    end

    -- 合成名表（显示名 -> 真实名）：上游不存在"干净名"时，列表显示干净名、请求时精确翻译回真实名。
    -- 由 normgen 脚本从模型列表推导生成（档位家族如 Doubao-*-Lite/Mini/Pro 自动保护不折）。
    -- 改上游列表后重新生成该表，勿手改；漂移由 verify.sh 检查。
-- >>>SYNTH_BEGIN （由 normgen 生成；规则=显示名->真实名。改上游列表后重新生成，勿手改）
MN_SYNTH_REWRITE = {
    ["claude-3-5-haiku"] = "claude-3-5-haiku-20241022",
    ["claude-3-5-sonnet"] = "claude-3-5-sonnet-20241022",
    ["claude-3-7-sonnet"] = "claude-3-7-sonnet-20250219",
    ["claude-fable-5"] = "claude-fable-5-1",
    ["claude-haiku-4-5"] = "claude-haiku-4-5-20251001",
    ["claude-opus-4-1"] = "claude-opus-4-1-20250805",
    ["claude-opus-4"] = "claude-opus-4-20250514",
    ["claude-opus-4-5"] = "claude-opus-4-5-20251101",
    ["claude-sonnet-4"] = "claude-sonnet-4-20250514",
    ["claude-sonnet-4-5"] = "claude-sonnet-4-5-20250929",
    ["deepseek-v4-flash-vision"] = "deepseek-v4-flash-vision-exp",
    ["gemini-3.8-flash"] = "gemini-3.8-flash-high",
    ["grok-4.20-multi-agent"] = "grok-4.20-multi-agent-0309",
    ["hy4"] = "hy4-preview",
    ["laguna-xs-2.1"] = "laguna-xs-2.1:free",
    ["ling-3.0-flash-sante"] = "ling-3.0-flash-sante:free",
    ["mistral-ocr-4"] = "mistral-ocr-4-1",
    ["nemotron-3-nano-omni-30b-a3b-reasoning"] = "nemotron-3-nano-omni-30b-a3b-reasoning:free",
    ["nemotron-3-super-120b-a12b"] = "nemotron-3-super-120b-a12b:free",
    ["nemotron-3.5-content-safety"] = "nemotron-3.5-content-safety:free",
    ["north-mini-code"] = "north-mini-code:free",
    ["sensenova-6.8-flash"] = "sensenova-6.8-flash-lite",
}
-- <<<SYNTH_END
    MN_SYNTH_DISPLAY = {}
    for d, t in pairs(MN_SYNTH_REWRITE) do MN_SYNTH_DISPLAY[t] = d end

    -- 请求体翻译（纯函数，供 rewrite_by_lua 调用；单测直接测本函数）。
    -- 语义：仅当「第一个 "model" 字段的值」精确命中合成名时改写；其余一律返回 nil（=原样透传）。
    function mn_rewrite_body(body)
        if type(body) ~= "string" or #body == 0 then return nil end
        local s, e, val = body:find('"model"%s*:%s*"([^"]+)"')
        if not s or not val then return nil end
        local t = MN_SYNTH_REWRITE[val]
        if not t then return nil end
        return body:sub(1, s - 1) .. '"model":"' .. t .. '"' .. body:sub(e + 1), val, t
    end
-- 健康表读写（纯函数，供 content/rewrite 调用；单测直接测本函数）
    function mn_health_key(model_id)
        return "health:" .. model_id:lower()
    end
    function mn_health_get(cache, model_id)
        local v = cache:get(mn_health_key(model_id))
        if not v or #v == 0 then return nil end
        local ok, h = pcall(cjson.decode, v)
        if not ok or type(h) ~= "table" then return nil end
        if os.difftime(os.time(), h.last_probe_ts or 0) > 2700 then return nil end
        return h
    end
    function mn_health_set(cache, model_id, status)
        cache:set(mn_health_key(model_id),
                  cjson.encode({status=status, last_probe_ts=os.time(), consecutive_failures=status=="dead" and 2 or 0}),
                  2700)
    end
-- <<<MODELNORM_END
}
# ==== MODELNORM 区 END ====


server {
    # ==== 健康表管理端点（仅内部可达）====
    location = /__modelnorm/health {
        content_by_lua_block {
            local cjson = require "cjson.safe"
            local args = ngx.req.get_uri_args()
            local method = ngx.req.get_method()
            local model = args.model
            if not model then ngx.status = 400; ngx.say('{"error":"missing model param"}'); return end
            if method == "GET" then
                local h = mn_health_get(ngx.shared.model_health, model)
                if h then ngx.say(cjson.encode({model=model, health=h}))
                else ngx.say(cjson.encode({model=model, health=nil, note="unknown/not yet probed"})) end
            elseif method == "PUT" then
                ngx.req.read_body()
                local body = ngx.req.get_body_data() or ""
                local data = cjson.decode(body)
                if not data or not data.status then ngx.status = 400; ngx.say('{"error":"missing status field"}'); return end
                mn_health_set(ngx.shared.model_health, model, data.status)
                ngx.say(cjson.encode({model=model, status=data.status, ok=true}))
            elseif method == "DELETE" then
                ngx.shared.model_health:delete(mn_health_key(model))
                ngx.say(cjson.encode({model=model, ok=true}))
            else ngx.status = 405; ngx.say('{"error":"method not allowed"}') end
        }
    }

    # 列出所有健康条目（调试用）
    location = /__modelnorm/health/list {
        content_by_lua_block {
            local cjson = require "cjson.safe"
            local auth = ngx.var.http_authorization or ""
            if auth ~= "Bearer health-admin-token" then ngx.exit(403) end
            local dict = ngx.shared.model_health
            local out = {}
            local keys = dict:get_keys(0)
            for _, key in ipairs(keys) do
                local value = dict:get(key)
                table.insert(out, {key=key, val=value})
            end
            ngx.say(cjson.encode({count=#out, entries=out}))
        }
    }

    listen 3000;
    listen [::]:3000;

    # 内部 endpoint：原样代理 NewAPI 的 /v1/models，供 lua subrequest 用
    location = /internal/models {
        internal;
        proxy_pass http://newapi_backend/v1/models;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # 对外 /v1/models：归一化（大小写去重 + 死名黑名单 + 条件归并 + 合成名显示）
    location ~ ^/v1/models/?$ {
        content_by_lua_block {
            local cjson = require "cjson.safe"
            local cache = ngx.shared.model_cache

            -- 按 token 隔离缓存，避免不同 key 的模型权限互相泄漏
            local auth = ngx.var.http_authorization or ""
            local ck = "models_clean:" .. auth

            local cached = cache:get(ck)
            if cached then
                ngx.header["Content-Type"] = "application/json; charset=utf-8"
                ngx.print(cached)
                return
            end

            local res = ngx.location.capture("/internal/models", { method = ngx.HTTP_GET })
            if not res or res.status ~= 200 then
                -- 上游异常时原样透传（含 401 等），不阻断
                ngx.status = res and res.status or 502
                ngx.print(res and res.body or '{"error":"upstream models fetch failed"}')
                return
            end

            local body = cjson.decode(res.body)
            if not body or not body.data then
                ngx.print(res.body)
                return
            end

            -- 死名黑名单：仅放「经 SQL 验证无任何活渠道」的名字。
            -- 维护方法（发现 picker 里选了报 No available channel 时）：
            --   SELECT DISTINCT a.model FROM abilities a
            --   JOIN channels c ON a.channel_id=c.id WHERE c.status=1;
            --   把「不在上面结果里、却出现在 /v1/models」的名字加进本表。
            -- 注意：大小写变体无需进黑名单，下面的去重逻辑会自动合并。
            local blacklist = {
                [""] = true,   -- 垃圾空 id 条目
            }

            -- canon_key / merged_key / name_rank / 合成表：见 http 级 MODELNORM 区块（纯 Lua，可单测）

            -- 名单全集（小写）："基名真实存在"的判据（条件归并用）
            local idset = {}
            for _, m in ipairs(body.data) do
                if m.id and m.id ~= "" then idset[m.id:lower()] = true end
            end

            local group, order = {}, {}
            for _, m in ipairs(body.data) do
                local id = m.id
                -- 健康检查：死模型跳过（TTL 过期视为未知，显示）
                if id and id ~= "" then
                    local h = mn_health_get(ngx.shared.model_health, id)
                    if h and h.status == "dead" then goto continue_norm end
                end
                if id and id ~= "" and not blacklist[id] then
                    local key = mn_merged_key(id, idset)
                    local held = group[key]
                    if not held then
                        group[key] = { m = m, name = id, rank = mn_name_rank(id) }
                        order[#order + 1] = key
                    else
                        local r = mn_name_rank(id)
                        if r < held.rank or (r == held.rank and #id < #held.name) then
                            held.m = m
                            held.name = id
                            held.rank = r
                        end
                    end
                end
                ::continue_norm::
            end

            local final = {}
            for _, key in ipairs(order) do
                local g = group[key]
                local d = MN_SYNTH_DISPLAY[g.name]
                if d then g.m.id = d end
                final[#final + 1] = g.m
            end

            local out = cjson.encode({
                object = body.object or "list",
                data = final,
                success = true,
            })
            cache:set(ck, out, 30)
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            ngx.print(out)
        }
    }

    # 其余请求（含 /v1/chat/completions）原样透传，支持 SSE 流式
    location / {
        # 合成名精确翻译：仅当请求体第一个 model 字段精确命中合成名(23个)时改写；其余一律透传（fail-open）
        rewrite_by_lua_block {
            local ok, err = pcall(function()
                local method = ngx.req.get_method()
                if method ~= "POST" and method ~= "PUT" and method ~= "PATCH" then return end
                local ct = ngx.var.content_type
                if not ct or not string.find(ct, "json", 1, true) then return end
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body then
                    local f = ngx.req.get_body_file()
                    if not f then return end
                    local fh = io.open(f, "rb")
                    if not fh then return end
                    local sz = fh:seek("end")
                    if not sz or sz > 8388608 then
                        fh:close()
                        ngx.log(ngx.WARN, "model rewrite skipped: body too large")
                        return
                    end
                    fh:seek("set", 0)
                    body = fh:read("*a")
                    fh:close()
                end
                if type(body) ~= "string" or #body > 8388608 then return end
                local new, val, tgt = mn_rewrite_body(body)
                if new then
                    ngx.req.set_body_data(new)
                    ngx.log(ngx.WARN, "model rewrite: ", val, " -> ", tgt)
                end
            end)
            if not ok then
                ngx.log(ngx.WARN, "model rewrite error, passthrough: ", err)
            end
        }
        proxy_pass http://newapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
